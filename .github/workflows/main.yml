name: Pytest with Allure Report (CI)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # REQUIRED for gh-pages

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Chrome
      uses: browser-actions/setup-chrome@v1

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install allure-pytest

    - name: Install Allure CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y default-jre
        wget https://github.com/allure-framework/allure2/releases/download/2.24.1/allure-2.24.1.tgz
        tar -zxf allure-2.24.1.tgz
        sudo mv allure-2.24.1 /opt/allure
        sudo ln -sf /opt/allure/bin/allure /usr/local/bin/allure
        allure --version

    - name: Prepare Allure directories
      run: |
        mkdir -p reports/allure-results
        mkdir -p reports/allure-report

    # 🔥 IMPORTANT FIX: run ALL tests in tests/
    - name: Run pytest (CI-safe)
      run: |
        pytest tests \
          -v \
          --alluredir=reports/allure-results \
          || true

    # 🔥 ALWAYS generate HTML so index.html exists
    - name: Generate Allure Report
      if: always()
      run: |
        allure generate reports/allure-results \
          -o reports/allure-report \
          --clean || true

    # Optional debug (safe to keep)
    - name: Debug Allure HTML
      if: always()
      run: |
        echo "==== reports ===="
        ls -la reports
        echo "==== allure-report ===="
        ls -la reports/allure-report

    - name: Deploy Allure Report to GitHub Pages
      if: always() && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: reports/allure-report
        publish_branch: gh-pages

