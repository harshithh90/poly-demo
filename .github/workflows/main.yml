name: Pytest with Allure Report (CI)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      CHROME_BIN: /usr/bin/google-chrome
      PYTHONUNBUFFERED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 🔥 INSTALL CHROME
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      # 🔍 DEBUG CHROME (helps diagnose crashes)
      - name: Verify Chrome installation
        run: |
          which google-chrome
          google-chrome --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🔥 INSTALL ALLURE CLI
      - name: Install Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          wget https://github.com/allure-framework/allure2/releases/download/2.24.1/allure-2.24.1.tgz
          tar -zxf allure-2.24.1.tgz
          sudo mv allure-2.24.1 /opt/allure
          sudo ln -sf /opt/allure/bin/allure /usr/local/bin/allure
          allure --version

      - name: Prepare Allure directories
        run: |
          mkdir -p reports/allure-results
          mkdir -p reports/allure-report

      # 🔥 RUN TESTS (CI SAFE)
      - name: Run pytest
        run: |
          pytest tests \
            -v \
            --maxfail=1 \
            --disable-warnings \
            --alluredir=reports/allure-results

      # 🔥 ALWAYS GENERATE ALLURE REPORT
      - name: Generate Allure Report
        if: always()
        run: |
          allure generate reports/allure-results \
            -o reports/allure-report \
            --clean

      - name: Debug Allure Report
        if: always()
        run: |
          echo "==== reports ===="
          ls -la reports
          echo "==== allure-report ===="
          ls -la reports/allure-report

      - name: Deploy Allure Report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/allure-report
          publish_branch: gh-pages
